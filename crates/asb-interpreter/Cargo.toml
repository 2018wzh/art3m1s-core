[package]
name = "asb-interpreter"
version = "0.2.0"
license = "MPL-2.0"
edition = "2024"

[features]
default = ["backend-lua51", "send"]
backend-lua51 = ["mlua/lua51"]
backend-luau = ["mlua/luau"]
# Optional so host workspaces that already unify mlua without `send`
# (Rc-based Lua state) can share one mlua build with this crate.
send = ["mlua/send"]

[dependencies]
mlua = { version = "0.10", default-features = false, features = ["serialize", "vendored"] }
asb-decrypt = { git = "https://github.com/Alphaly2K/asb-decrypt" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
thiserror = "2.0"
libc = "0.2"